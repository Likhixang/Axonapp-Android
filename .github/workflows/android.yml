name: Android

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install required SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore stable debug signing identity
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if test -n "${DEBUG_KEYSTORE_BASE64}"; then
            mkdir -p "$HOME/.android"
            printf '%s' "${DEBUG_KEYSTORE_BASE64}" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
          fi
      - name: Test, lint, and assemble
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon --console=plain
      - name: Verify APK alignment and signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: axonapp-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          if-no-files-found: ignore
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Check tag matches versionName
        run: |
          version_name="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          test "v${version_name}" = "${GITHUB_REF_NAME}"
      - name: Configure optional release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if test -n "${KEYSTORE_BASE64}" && test -n "${STORE_PASSWORD}" && test -n "${KEY_ALIAS}" && test -n "${KEY_PASSWORD}"; then
            keystore_path="${RUNNER_TEMP}/axonapp-release.jks"
            printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"
            echo "AXONHUB_SIGNING_STORE_FILE=${keystore_path}" >> "${GITHUB_ENV}"
            echo "AXONHUB_SIGNING_STORE_PASSWORD=${STORE_PASSWORD}" >> "${GITHUB_ENV}"
            echo "AXONHUB_SIGNING_KEY_ALIAS=${KEY_ALIAS}" >> "${GITHUB_ENV}"
            echo "AXONHUB_SIGNING_KEY_PASSWORD=${KEY_PASSWORD}" >> "${GITHUB_ENV}"
          fi
      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --console=plain
      - name: Download verified installable debug APK
        uses: actions/download-artifact@v4
        with:
          name: axonapp-debug-apk
          path: verified-debug
      - name: Select release artifact
        run: |
          if test -f app/build/outputs/apk/release/app-release.apk; then
            cp app/build/outputs/apk/release/app-release.apk "axonapp-${GITHUB_REF_NAME}.apk"
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk "axonapp-${GITHUB_REF_NAME}-unsigned.apk"
          fi
      - name: Include stable-signed debug APK
        run: cp verified-debug/app-debug.apk "axonapp-${GITHUB_REF_NAME}-debug.apk"
      - name: Publish tag release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: axonapp-*.apk
